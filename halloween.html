<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Magic Spell Game</title>
        <link rel="stylesheet" href="styles/halloween.css">
    </head>
    <body>
        <!--
            The canvas resolution is set from src/config/settings.js at boot, so
            it is intentionally not hard-coded here. CSS scales the element to
            fill the viewport while keeping the 4:3 ratio.

            Only one script tag: src/main.js is the single entry point and pulls
            in the rest of the ES module graph itself.
        -->
        <canvas id="gameCanvas" width="1200" height="900"></canvas>
        <script type="module" src="src/main.js"></script>
    </body>
</html>
